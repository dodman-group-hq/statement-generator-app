<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Forgot password — Statement Generator</title>
<link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/statement-generator-theme.css">
<style>
  .auth-wrap{max-width:400px; margin:80px auto; padding:0 20px;}
  .card{background:#faf9f4; border:1px solid var(--paper-line); padding:32px; box-shadow:0 1px 3px rgba(0,0,0,.06);}
  .card h1{font-size:22px; margin:0 0 8px; text-align:center;}
  .card .lead{font-size:13.5px; color:var(--ink-soft); text-align:center; margin:0 0 24px;}
  label{display:block; font-size:13px; color:var(--ink-soft); margin-bottom:4px;}
  input{width:100%; padding:10px 12px; margin-bottom:16px; border:1px solid var(--paper-line); border-radius:2px; font-size:15px; background:#fff;}
  .btn-primary{width:100%; text-align:center;}
  .alt-link{text-align:center; margin-top:16px; font-size:13px;}
  #form-error{display:none; background:#f7e6e2; border:1px solid var(--bad); color:var(--bad); padding:10px 12px; font-size:13px; margin-bottom:16px;}
  #form-success{display:none; background:#e3ede6; border:1px solid var(--good); color:var(--good); padding:12px; font-size:13.5px;}
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="card">
    <h1>Forgot your password?</h1>
    <p class="lead">Enter your email and we'll send you a link to choose a new one.</p>
    <div id="form-error"></div>
    <div id="form-success"></div>
    <form id="forgot-form">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" required>
      <button type="submit" class="btn btn-primary" id="submit-btn">Send reset link</button>
    </form>
    <p class="alt-link"><a href="/accounts/login">Back to log in</a></p>
  </div>
</div>
<script>
  const form = document.getElementById('forgot-form');
  const btn = document.getElementById('submit-btn');
  const errorBox = document.getElementById('form-error');
  const successBox = document.getElementById('form-success');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Sending...';
    try {
      const resp = await fetch('/accounts/forgot-password', { method: 'POST', body: new FormData(form) });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) {
        errorBox.textContent = data.message || 'Something went wrong. Please try again.';
        errorBox.style.display = 'block';
        return;
      }
      form.style.display = 'none';
      successBox.textContent = data.message;
      successBox.style.display = 'block';
    } catch (err) {
      errorBox.textContent = 'Network error - please check your connection and try again.';
      errorBox.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Send reset link';
    }
  });
</script>
</body>
</html>

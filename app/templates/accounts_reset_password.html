<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<!-- The reset token is in this page's URL. Never send it on as a Referer to the font host. -->
<meta name="referrer" content="no-referrer">
<title>Choose a new password — Statement Generator</title>
<link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
<link rel="stylesheet" href="/static/css/statement-generator-theme.css">
<style>
  .auth-wrap{max-width:400px; margin:80px auto; padding:0 20px;}
  .card{background:#faf9f4; border:1px solid var(--paper-line); padding:32px; box-shadow:0 1px 3px rgba(0,0,0,.06);}
  .card h1{font-size:22px; margin:0 0 24px; text-align:center;}
  label{display:block; font-size:13px; color:var(--ink-soft); margin-bottom:4px;}
  input{width:100%; padding:10px 12px; margin-bottom:16px; border:1px solid var(--paper-line); border-radius:2px; font-size:15px; background:#fff;}
  .btn-primary{width:100%; text-align:center;}
  .alt-link{text-align:center; margin-top:16px; font-size:13px;}
  .form-text{font-size:12px; color:var(--ink-soft); margin:-10px 0 16px;}
  #form-error{display:none; background:#f7e6e2; border:1px solid var(--bad); color:var(--bad); padding:10px 12px; font-size:13px; margin-bottom:16px;}
  .dead-link{background:#f7e6e2; border:1px solid var(--bad); color:var(--bad); padding:12px; font-size:13.5px; margin-bottom:8px;}
  #form-success{display:none; background:#e3ede6; border:1px solid var(--good); color:var(--good); padding:12px; font-size:13.5px;}
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="card">
    <h1>Choose a new password</h1>

    {% if error %}
      <div class="dead-link">{{ error }}</div>
      <p class="alt-link"><a href="/accounts/forgot-password">Request a new link</a></p>
    {% else %}
      <div id="form-error"></div>
      <div id="form-success"></div>
      <form id="reset-form">
        <input type="hidden" name="token" value="{{ token }}">
        <label for="password">New password</label>
        <input type="password" id="password" name="password" minlength="8" autocomplete="new-password" required>
        <p class="form-text">At least 8 characters.</p>
        <label for="confirm">Confirm new password</label>
        <input type="password" id="confirm" autocomplete="new-password" required>
        <button type="submit" class="btn btn-primary" id="submit-btn">Update password</button>
      </form>
      <p class="alt-link"><a href="/accounts/login">Back to log in</a></p>
    {% endif %}
  </div>
</div>
{% if not error %}
<script>
  const form = document.getElementById('reset-form');
  const btn = document.getElementById('submit-btn');
  const errorBox = document.getElementById('form-error');
  const successBox = document.getElementById('form-success');

  function showError(msg) { errorBox.textContent = msg; errorBox.style.display = 'block'; }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    if (document.getElementById('password').value !== document.getElementById('confirm').value) {
      showError('The two passwords do not match.');
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Updating...';
    try {
      const resp = await fetch('/accounts/reset-password', { method: 'POST', body: new FormData(form) });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) { showError(data.message || 'Something went wrong. Please try again.'); return; }
      form.style.display = 'none';
      successBox.textContent = data.message + ' Redirecting to log in...';
      successBox.style.display = 'block';
      // Drop the token from the address bar/history now that it has been used.
      history.replaceState(null, '', '/accounts/reset-password');
      setTimeout(() => { window.location.href = '/accounts/login'; }, 2000);
    } catch (err) {
      showError('Network error - please check your connection and try again.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Update password';
    }
  });
</script>
{% endif %}
</body>
</html>
